<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#EAF9FF"/>
      <stop offset="0.55" stop-color="#9CD9F0"/>
      <stop offset="1" stop-color="#55B2DA"/>
    </linearGradient>
    <radialGradient id="drop" cx="0.36" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#EFF9FD"/>
      <stop offset="1" stop-color="#B9DFF2"/>
    </radialGradient>
  </defs>

  <rect width="108" height="108" fill="url(#bg)"/>

  <g transform="translate(9.72,9.72) scale(0.82)">
    <!-- steam wisps -->
    <g fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" opacity="0.95">
      <path d="M48,28 C44,23.5 44.5,17.5 49,14"/>
      <path d="M60,28 C64,23.5 63.5,17.5 59,14"/>
    </g>

    <!-- droplet body -->
    <path d="M54,30.5 C45,43 34,55 34,64.5 a20,20 0 0 0 40,0 C74,55 63,43 54,30.5 z" fill="url(#drop)"/>

    <!-- gloss on the left shoulder -->
    <path d="M45.5,48 C43.2,52.5 42,57 42,61" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

    <!-- cheeks -->
    <circle cx="41" cy="69.5" r="3.8" fill="#FF8FA8" opacity="0.45"/>
    <circle cx="67" cy="69.5" r="3.8" fill="#FF8FA8" opacity="0.45"/>

    <!-- eyes -->
    <circle cx="47" cy="63.5" r="3.4" fill="#16404F"/>
    <circle cx="61" cy="63.5" r="3.4" fill="#16404F"/>
    <circle cx="45.9" cy="62.2" r="1.35" fill="#FFFFFF"/>
    <circle cx="59.9" cy="62.2" r="1.35" fill="#FFFFFF"/>

    <!-- smile -->
    <path d="M47.6,71.6 Q54,77.6 60.4,71.6" fill="none" stroke="#16404F" stroke-width="2.8" stroke-linecap="round"/>

    <!-- sparkle -->
    <path d="M73.5,35.5 l1.3,3.1 3.1,1.3 -3.1,1.3 -1.3,3.1 -1.3,-3.1 -3.1,-1.3 3.1,-1.3 z" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>
